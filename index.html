<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FM Hub - Menedżer Kariery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 pb-28 min-h-screen selection:bg-emerald-500 selection:text-white">
    <!-- NAGŁÓWEK -->
    <header class="glass-panel border-b border-slate-800/80 p-4 sticky top-0 z-30 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-md shadow-emerald-500/20">
                <i class="fa-solid fa-futbol text-slate-950 font-bold text-sm"></i>
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">FM HUB</h1>
                <p class="text-[10px] text-slate-400 font-medium leading-none">Dziennik Kariery</p>
            </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Offline Ready
        </span>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-5">
        <!-- ZAWODNICY -->
        <section id="tab-players" class="space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">Kadra Zespołu</h2>
                    <p class="text-xs text-slate-400">Twoi kluczowi gracze i ich statystyki</p>
                </div>
                <button onclick="openModal('player-modal')" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-900/30 active:scale-95 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-xs"></i> Dodaj
                </button>
            </div>
            <div id="players-list" class="space-y-2.5"></div>
        </section>

        <!-- TROFEA -->
        <section id="tab-awards" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">Gablota Trofeów</h2>
                    <p class="text-xs text-slate-400">Zdobyte puchary i tytuły</p>
                </div>
                <button onclick="openModal('award-modal')" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-amber-900/30 active:scale-95 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-xs"></i> Dodaj
                </button>
            </div>
            <div id="awards-list" class="space-y-2.5"></div>
        </section>

        <!-- MIESIĄCE -->
        <section id="tab-months" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">Piłkarz Miesiąca</h2>
                    <p class="text-xs text-slate-400">Najlepsi gracze poszczególnych miesięcy</p>
                </div>
                <button onclick="openMonthModal()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-90
